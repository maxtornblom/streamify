<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Streamify">
  <defs>
    <linearGradient id="g" x1="12" y1="6" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3be477"/>
